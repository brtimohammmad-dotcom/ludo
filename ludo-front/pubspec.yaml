name: ludo
description: "A new Game named Ludo for Telegram."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0
  socket_io_client: ^3.1.4
  lottie: ^3.3.2
  telegram_web_app: ^0.3.3
  http: ^1.6.0
  loading_animation_widget:
  confetti: ^0.7.0
  riverpod_annotation: ^4.0.3
  flutter_riverpod: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Italic-VariableFont_wdth,wght.ttf
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf

  assets:
    - assets/lotties/
    - assets/webp/
    - assets/audio/music/
    - assets/audio/sound-effect/
