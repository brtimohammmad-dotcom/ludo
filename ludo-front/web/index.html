<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Game named Ludo for Bale.">

    <base href="./">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ludo">

    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link rel="manifest" href="manifest.json">

    <title>ludo</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            color: white;
            background-color: #07070b;
        }

        flt-glass-pane,
        flutter-view,
        .flt-background,
        #flt-target,
        flt-layer-host,
        flt-scene-host {
            background: transparent !important;
            background-color: transparent !important;
        }

        #loader {
            position: absolute;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #2a1455, #07070b);
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .center-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60vmin;
            height: 60vmin;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.08), transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .dice-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80vmin;
            height: 80vmin;
            transform: translate(-50%, -50%);
            animation: rotate 18s linear infinite;
        }

        @keyframes rotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .dice {
            position: absolute;
            font-size: 46px;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.25));
        }

        .d1 { top: 0; left: 50%; transform: translate(-50%, -50%); color: #ff4d4d; }
        .d2 { top: 15%; left: 85%; color: #4dd2ff; }
        .d3 { top: 50%; left: 100%; color: #ffd24d; }
        .d4 { top: 85%; left: 85%; color: #7dff4d; }
        .d5 { top: 100%; left: 50%; color: #ff7de9; transform: translate(-50%, -50%); }
        .d6 { top: 85%; left: 15%; color: #a64dff; }
        .d7 { top: 50%; left: 0%; color: #ffb84d; }
        .d8 { top: 15%; left: 15%; color: #4dffcc; }

        .dice-spinner {
            width: 60px;
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 2.5s infinite linear;
            margin-bottom: 25px;
            z-index: 3;
        }

        @keyframes spin {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
        }

        .face {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffffff, #e0e0e0);
            border: 2px solid #b0b0b0;
            border-radius: 12px;
            font-size: 38px;
            font-weight: bold;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.15), 0 0 15px rgba(255,215,0,0.3);
            backface-visibility: hidden;
        }

        .front  { transform: translateZ(30px); }
        .back   { transform: rotateY(180deg) translateZ(30px); }
        .left   { transform: rotateY(-90deg) translateZ(30px); }
        .right  { transform: rotateY(90deg) translateZ(30px); }
        .top    { transform: rotateX(90deg) translateZ(30px); }
        .bottom { transform: rotateX(-90deg) translateZ(30px); }

        .text-container {
            position: relative;
            height: 24px;
            width: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 14px;
            z-index: 3;
        }

        .text-status {
            position: absolute;
            font-size: 16px;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .text-status.active {
            opacity: 0.95;
        }

        .dots span {
            animation: blink 1.4s infinite both;
            margin-left: 2px;
            font-weight: bold;
        }

        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
    </style>
</head>

<body>

<div id="loader">
    <div class="center-glow"></div>

    <div class="dice-bg">
        <div class="orbit">
            <div class="dice d1">⚀</div>
            <div class="dice d2">⚁</div>
            <div class="dice d3">⚂</div>
            <div class="dice d4">⚃</div>
            <div class="dice d5">⚄</div>
            <div class="dice d6">⚅</div>
            <div class="dice d7">⚀</div>
            <div class="dice d8">⚁</div>
        </div>
    </div>

    <div class="dice-spinner">
        <div class="face front">⚀</div>
        <div class="face back">⚅</div>
        <div class="face right">⚂</div>
        <div class="face left">⚃</div>
        <div class="face top">⚁</div>
        <div class="face bottom">⚄</div>
    </div>

    <div class="text-container">
        <div class="text-status active" id="txt-loading">
            Loading game<span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
        <div class="text-status" id="txt-connecting">
            Connecting to Server<span class="dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
    </div>
</div>

<script>
    // 🟢 اصلاح شد: تغییر وضعیت متون لودینگ به محض آماده شدن اولین فریم فلاتر
    window.addEventListener("flutter-first-frame", function () {
        const loadingText = document.getElementById("txt-loading");
        const connectingText = document.getElementById("txt-connecting");

        if (loadingText && connectingText) {
            loadingText.classList.remove("active");
            connectingText.classList.add("active");
        }
    });

    window.onGameConnected = function () {
        const loader = document.getElementById("loader");
        if (loader) {
            loader.style.opacity = "0";
            setTimeout(() => {
                loader.remove();
            }, 500);
        }
    };
</script>

<script src="flutter_bootstrap.js" async></script>

</body>
</html>
