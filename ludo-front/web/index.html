    <meta name="description" content="A new Game named Ludo for Telegram.">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        (function() {
          if (window.Telegram && window.Telegram.WebApp) {
            var webapp = window.Telegram.WebApp;

            webapp.ready();
            webapp.expand();

            if (webapp.disableVerticalSwipe) {
              webapp.disableVerticalSwipe();
            }
            webapp.enableClosingConfirmation();

            webapp.setHeaderColor('#0b121e');
            webapp.setBackgroundColor('#0b121e');

            function applySafeArea() {
              var topInset = (webapp.safeAreaInset && webapp.safeAreaInset.top)
                ? webapp.safeAreaInset.top
                : (webapp.contentSafeAreaInset && webapp.contentSafeAreaInset.top)
                  ? webapp.contentSafeAreaInset.top
                  : 0;

              document.documentElement.style.setProperty('--tg-safe-top', topInset + 'px');
            }

            applySafeArea();
            webapp.onEvent('safeAreaChanged', applySafeArea);
          }
        })();

        document.addEventListener('touchmove', function(e) {
            if (e.touches.length === 1) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>ludo</title>
    <style>
        :root {
            --tg-safe-top: env(safe-area-inset-top, 0px);
        }

        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            color: white;
            background-color: #0b121e;
            position: fixed;
            width: 100%;
            padding-top: var(--tg-safe-top);
            box-sizing: border-box;
        }

        flt-glass-pane,
        flutter-view,
        .flt-background,
        #flt-target,
        flt-layer-host,
        flt-scene-host {
            background: transparent !important;
            background-color: transparent !important;
        }

        /* 🟢 کانتینر اصلی لودر */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #182538, #0b121e);
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        /* 🌌 هاله نور پشت تاس */
        .center-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70vmin;
            height: 70vmin;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 200, 0, 0.12), transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.85; }
        }

        /* 🎲 کانتینر SVG تاس */
        .custom-svg-container {
            position: relative;
            width: 160px;
            height: 160px;
            z-index: 3;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.15));
            opacity: 0;
            animation: fadeInSvg 0.3s ease-out forwards;
            animation-delay: 0.15s;
        }

        @keyframes fadeInSvg {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .custom-svg-container svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 📝 استایل متون لودینگ */
        .text-container {
            position: relative;
            height: 24px;
            width: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
        }

        .text-status {
            position: absolute;
            font-size: 15px;
            letter-spacing: 0.8px;
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            align-items: center;
            white-space: nowrap;
            color: #e2e8f0;
        }

        .text-status.active {
            opacity: 0.95;
        }

        .dots span {
            animation: blink 1.4s infinite both;
            margin-left: 2px;
            font-weight: bold;
        }

        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
    </style>
</head>

<script>
    window.addEventListener("flutter-first-frame", function () {
        const loadingText = document.getElementById("txt-loading");
        const connectingText = document.getElementById("txt-connecting");

        if (loadingText && connectingText) {
            loadingText.classList.remove("active");
            connectingText.classList.add("active");
        }
    });

    window.onGameConnected = function () {
        const loader = document.getElementById("loader");
        if (loader) {
            loader.style.opacity = "0";
            setTimeout(() => {
                loader.remove();
            }, 500);
        }
    };
</script>

<script src="flutter_bootstrap.js" async></script>
